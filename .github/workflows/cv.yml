name: Typeset profile

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - "fonts/**"
      - "scripts/**"
      - ".github/workflows/cv.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly: refresh the star count in the footer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Fetch brilliant-CV star count
        id: stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "count=$(gh api repos/yunanwg/brilliant-CV --jq .stargazers_count)" >> "$GITHUB_OUTPUT"

      - name: Compile CV
        run: |
          typst compile cv/cv.typ assets/cv-light.svg --format svg \
            --font-path fonts --ignore-system-fonts \
            --input stars=${{ steps.stars.outputs.count }}
          python3 scripts/postprocess.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: retypeset profile CV"
          git push
